<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
  
  <!-- Mouse Body -->
  <rect x="156" y="100" width="200" height="312" rx="100" fill="none" stroke="url(#accent)" stroke-width="20" filter="url(#glow)"/>
  
  <!-- Center Divider & Scroll Wheel -->
  <line x1="256" y1="100" x2="256" y2="210" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <rect x="238" y="150" width="36" height="64" rx="18" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Wireless Wave Arcs -->
  <path d="M 200 60 A 70 70 0 0 1 312 60" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 160 30 A 115 115 0 0 1 352 30" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
</svg>

